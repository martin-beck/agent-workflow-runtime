[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-workflow-runtime-cli"
version = "0.1.7"
description = "Provider-neutral local mock bootstrap CLI for Agent Workflow Runtime"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
awr = "awr_cli.cli:main"

[tool.setuptools]
packages = ["awr_cli", "scripts"]
