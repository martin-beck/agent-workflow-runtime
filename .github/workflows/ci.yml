name: Agent Workflow Runtime CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: awr-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-tests:
    name: Offline tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile source and tests
        run: python -m compileall -q scripts tests
      - name: Run offline test suite
        run: python -m unittest discover -s tests -v
      - name: Run AR-0098 bounded authority model
        run: python scripts/check_authority_interaction.py --spec specifications/authority-interaction-v1.json --trace specifications/fixtures/authority-interaction-ar0098-v1.json --bounded-depth 4
      - name: Run AR-0085 session contract checker
        run: python scripts/check_agent_sessions.py --spec specifications/agent-session-v1.json --fixture specifications/fixtures/agent-session-ar0085-v1.json --expected-revision 3
      - name: Run AR-0086 fair scheduler contract checker
        run: python scripts/check_fair_scheduler.py --spec specifications/fair-scheduler-v1.json --fixture specifications/fixtures/fair-scheduler-ar0086-v1.json --expected-revision 3
      - name: Run AR-0088 authority bridge contract checker
        run: python scripts/check_authority_bridges.py --spec specifications/authority-bridges-v1.json --record specifications/fixtures/authority-bridges-ar0088-v1.json --evidence specifications/fixtures/authority-bridges-ar0088-evidence-v1.json --expected-revision 3
      - name: Run AR-0090 cross-agent accounting contract checker
        run: python scripts/check_cross_agent_accounting.py --spec specifications/cross-agent-accounting-v1.json --fixture specifications/fixtures/cross-agent-accounting-ar0090-v1.json --expected-revision 3
      - name: Run AR-0091 operational observability contract checker
        run: python scripts/check_operational_observability.py --spec specifications/operational-observability-v1.json --fixture specifications/fixtures/operational-observability-ar0091-v1.json --expected-revision 3
      - name: Run AR-0092 executable security contract checker
        run: python scripts/check_executable_security.py --spec specifications/executable-security-v1.json --fixture specifications/fixtures/executable-security-ar0092-v1.json --expected-revision 3
      - name: Run AR-0093 deployment operations contract checker
        run: python scripts/check_deployment_operations.py --spec specifications/deployment-operations-v1.json --fixture specifications/fixtures/deployment-operations-ar0093-v1.json --expected-revision 3
      - name: Run AR-0094 integrated qualification contract checker
        run: python scripts/check_integrated_qualification.py --spec specifications/integrated-qualification-v1.json --fixture specifications/fixtures/integrated-qualification-ar0094-v1.json --expected-revision 3
      - name: Run AR-0095 multi-project workflow contract checker
        run: python scripts/check_multi_project_workflow.py --spec specifications/multi-project-workflow-v1.json --fixture specifications/fixtures/multi-project-workflow-ar0095-v1.json --expected-revision 3
      - name: Run AR-0096 release readiness contract checker
        run: python scripts/check_release_readiness.py --spec specifications/release-readiness-v1.json --fixture specifications/fixtures/release-readiness-ar0096-v1.json --expected-revision 3
      - name: Run AR-0087 project isolation contract checker
        run: python scripts/check_project_isolation.py --spec specifications/multi-project-isolation-v1.json --fixture specifications/fixtures/multi-project-isolation-ar0087-v1.json --expected-revision 3
      - name: Run AR-0089 project integration contract checker
        run: python scripts/check_project_integration.py --spec specifications/project-integration-v1.json --fixture specifications/fixtures/project-integration-ar0089-v1.json --expected-revision 3
      - name: Run AR-0099 TLA+/TLC authority model
        run: python scripts/check_tlc_authority.py

  schemas-and-fixtures:
    name: JSON schema and fixture integrity
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Parse every JSON contract and fixture
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          paths = sorted(Path('.').glob('specifications/**/*.json'))
          if not paths:
              raise SystemExit('no specifications found')
          for path in paths:
              with path.open(encoding='utf-8') as handle:
                  json.load(handle)
          print(f'parsed {len(paths)} JSON specifications and fixtures')
          PY
      - name: Run contract checkers through tests
        run: python -m unittest discover -s tests -q

  source-hygiene:
    name: Source hygiene and offline boundary
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Reject accidental private or network-bound source markers
        run: |
          python - <<'PY'
          from pathlib import Path

          forbidden = ('OPENAI_' + 'API_KEY', 'ANTHROPIC_' + 'API_KEY', 'AWS_' + 'SECRET_ACCESS_KEY')
          for path in Path('.').rglob('*'):
              if not path.is_file() or '.git' in path.parts or path.suffix not in {'.py', '.json', '.md', '.yaml', '.yml'}:
                  continue
              text = path.read_text(encoding='utf-8', errors='strict')
              for marker in forbidden:
                  if marker in text:
                      raise SystemExit(f'forbidden credential marker {marker} in {path}')
          PY
      - name: Check whitespace and tracked-source integrity
        run: git diff --check
